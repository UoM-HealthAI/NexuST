model:
  d_model: 192
  dropout: 0.1
  max_value: 512
  n_genes: 300
  n_heads: 3
  n_layers: 3
  gene_mask_ratio: 0.20
  
training:
  learning_rate: 3e-4
  max_steps: 1000
  warmup_steps: 100
  accumulate_grad_batches: 2

dataset:
  batch_size: 6
  train_dir: datasets/pretrain/train
  val_dir: datasets/pretrain/val

logging:
  project_name: HiGeST-pretrain
  save_dir: checkpoints/pretrain
  log_every_n_steps: 20
  val_check_interval: 50
  save_every_n_steps: 100
  save_top_k: 1
  monitor_metric: "val_loss"
  monitor_mode: "min"

compute:
  devices: 1
  num_nodes: 1
